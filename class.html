<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table, classes, id, and position</title>
    <link rel="stylesheet" href="index.css" >
</head> 

<body>

    <h1>Table</h1>

    <table>
        <!-- table head -->
        <tr>
            <th class="name">Student</th>
            <th>Class</th>
            <th>Gender</th>
            <th>Age</th>
        </tr>
        <!-- table content -->
        <tr>
            <td class="name">Wisdom</td>
            <td>Jss 1</td>
            <td>Male</td>
            <td>11</td>
        </tr>
        <tr>
            <td class="name">John</td>
            <td>Jss 2</td>
            <td>Male</td>
            <td>12</td>
        </tr>
        <tr>
            <td>Alex</td>
            <td>Jss 2</td>
            <td>Male</td>
            <td id="age">9</td>
        </tr>
    </table>

    <h1>position</h1>
    <ol>
        <li>static, the default</li>
        <li>relative</li>
        <li>fixed</li>
        <li>absolute</li>
        <li>sticky</li>
    </ol>

    <h2>relative</h2>

    <div style=" background-color: yellow; padding-top: 20px; padding-bottom: 20px; " >
        <div class="relative" > 
            this is relative
        </div>
    </div>
    
    <h2>fixed</h2>
    

    <div class="fixed" >
        this is fixed
    </div>
    <h2>Absolute</h2>

    <div class="absolute" >
        this is absolute
    </div>
    <h2>sticky</h2>

    <div class="sticky" >
        this is sticky
    </div>
    <div style=" background-color: blueviolet; width: 100px; height: 1000px; " >
 
    </div>
</body>

</html>
